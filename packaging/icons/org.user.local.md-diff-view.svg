<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    md-diff's icon: a page with one added and one removed line, and the
    overview strip down its right edge.  The palette is the application's own
    (#10b981/#d1fae5 added, #ef4444/#fee2e2 removed, #eab308 changed) so the
    icon and the window it opens read as the same thing.
  -->
  <defs>
    <clipPath id="page">
      <rect x="7" y="4" width="50" height="56" rx="5"/>
    </clipPath>
  </defs>

  <!-- Page -->
  <rect x="7" y="4" width="50" height="56" rx="5" fill="#ffffff"/>

  <!-- Unchanged text -->
  <g fill="#c9d1d9">
    <rect x="14" y="12" width="24" height="3.5" rx="1.75"/>
    <rect x="14" y="19" width="16" height="3.5" rx="1.75"/>
    <rect x="14" y="48" width="26" height="3.5" rx="1.75"/>
  </g>

  <!-- Added line -->
  <rect x="12" y="26" width="32" height="8" rx="2" fill="#d1fae5"/>
  <rect x="15" y="29" width="22" height="2.5" rx="1.25" fill="#10b981"/>

  <!-- Removed line -->
  <rect x="12" y="37" width="28" height="8" rx="2" fill="#fee2e2"/>
  <rect x="15" y="40" width="18" height="2.5" rx="1.25" fill="#ef4444"/>

  <!-- Overview strip, clipped to the page so it keeps the rounded corners -->
  <g clip-path="url(#page)">
    <rect x="48" y="4" width="9" height="56" fill="#f6f8fa"/>
    <rect x="50" y="26" width="5" height="8" rx="1.5" fill="#10b981"/>
    <rect x="50" y="37" width="5" height="8" rx="1.5" fill="#ef4444"/>
    <rect x="50" y="48" width="5" height="5" rx="1.5" fill="#eab308"/>
  </g>

  <!-- Border last, so it sits over the strip -->
  <rect x="7" y="4" width="50" height="56" rx="5" fill="none"
        stroke="#8b949e" stroke-width="2.5"/>
  <line x1="48" y1="4" x2="48" y2="60" stroke="#8b949e" stroke-width="1.5"/>
</svg>
